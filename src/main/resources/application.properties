spring.application.name=msvc-products
server.port=${PORT:0}

spring.datasource.url=jdbc:mysql://${MYSQL_URL:localhost:3306}/springboot_cloud
spring.datasource.username=${MYSQL_USER:kleec}
spring.datasource.password=${MYSQL_PASS:Admin123*}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

eureka.instance.instance-id=${spring.cloud.client.hostname}:${spring.application.name}:${random.value}

